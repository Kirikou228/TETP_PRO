name: Build TEPG PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android SDK
        run: echo "Utilisation du SDK Android preinstalle"

      - name: Installer les dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Installer les outils Android et AIDL
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERREUR : sdkmanager introuvable"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          find "$ANDROID_HOME/build-tools" -name aidl -type f

      - name: Compiler TEPG PRO
        env:
          P4A_ACCEPT_LICENSE: "1"
        run: buildozer -v android debug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: TEPG-PRO-APK
          path: bin/*.apk
          if-no-files-found: error
